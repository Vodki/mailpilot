version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - forbidigo
    - gosec
    - nilerr
    - noctx
    - unconvert
  settings:
    forbidigo:
      forbid:
        # Output to the user goes through explicit writers; logs through slog.
        - pattern: ^fmt\.Print(f|ln)?$
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
    gosec:
      excludes:
        - G204 # running the configured claude binary is intentional
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, contextcheck]
      # Environment variable names, not credentials.
      - path: internal/config/config\.go
        text: G101
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/Vodki/mailpilot]
