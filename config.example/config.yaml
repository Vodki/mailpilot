# Configuration non secrète de mailpilot.
# Les secrets (mots de passe, jetons) viennent de l'environnement : voir .env.example.
# Toute clé inconnue est refusée au démarrage, pour attraper les fautes de frappe.

timezone: Europe/Paris
log_level: info          # debug | info | warn | error
data_dir: /data          # base SQLite et état

# Mes autres adresses (alias) : servent à savoir si un mail m'est adressé
# directement et à m'exclure des destinataires d'une réponse.
self_aliases: []

# Les fichiers de ce dossier remplacent les prompts intégrés du même nom
# (triage_system.md, draft_system.md, ask_system.md). Dossier absent : défauts.
prompts_dir: /config/prompts

# Règles de pré-filtrage et profil, rechargés à chaud (SIGHUP ou /reload).
# Fichier absent : aucune règle, profil vide.
rules_path: /config/rules.yaml
profile_path: /config/profile.md

imap:
  host: pro3.mail.ovh.net
  port: 993
  security: tls          # tls (implicite) | starttls ; pas de mode en clair
  username: prenom.nom@exemple.fr
  mailbox: INBOX
  idle_refresh: 25m      # RFC 2177 : moins de 29 minutes
  poll_interval: 90s     # repli si le serveur n'annonce pas IDLE
  bootstrap_days: 7      # import silencieux au premier démarrage
  timeout: 30s

smtp:
  host: pro3.mail.ovh.net
  port: 587
  security: starttls
  # username: par défaut, celui d'IMAP
  send_enabled: false    # aucun envoi tant que ce n'est pas true
  timeout: 30s

telegram:
  chat_id: 0             # ton chat_id ; tout autre expéditeur est ignoré

llm:
  provider: claude-cli
  claude_cli:
    binary: claude
    timeout: 90s
    max_concurrency: 1
  tasks:
    triage: { model: claude-opus-5-5, effort: low,    max_budget_usd: 0.5 }
    draft:  { model: claude-opus-5-5, effort: medium, max_budget_usd: 1 }
    ask:    { model: claude-opus-5-5, effort: medium, max_budget_usd: 1 }

todoist:
  enabled: false
  mode_dated: auto       # auto | confirm | off
  mode_undated: confirm
  project_id: ""
  labels: [mailpilot]

digest:
  times: ["08:30", "18:00"]

retention:
  body_days: 30
